name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: joatverse/.github/.github/workflows/commitlint.yml@main

  format:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: joatverse/.github/.github/workflows/format.yml@main
    with:
      runtime: python

  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: joatverse/.github/.github/workflows/release.yml@main
    with:
      runtime: python
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
